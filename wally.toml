[package]
name = "startklar/robloxprojects"
description = "High-performance networking and ECS stack"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
# Pin to the valid version published on Wally
ByteNet = "ffrostflame/bytenet@0.4.6"

# ECS framework
Matter = "matter-ecs/matter@0.8.5"

# Zero-allocation event signaling
GoodSignal = "stravant/goodsignal@0.3.1"

[dev-dependencies]
TestEZ = "roblox/testez@0.4.1"